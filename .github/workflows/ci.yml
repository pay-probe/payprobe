name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-worker:
    name: Worker Engine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd packages/worker
          pip install -e ".[dev]"
      - name: Lint
        run: cd packages/worker && ruff check . && black --check .
      - name: Test
        run: cd packages/worker && pytest tests/ -v --cov=. --cov-report=xml

  test-services:
    name: Backend Service Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: payprobe_test
          POSTGRES_USER: payprobe
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Test orchestrator
        run: cd packages/orchestrator && pip install -e ".[dev]" && pytest tests/ -v
      - name: Test scenario-service
        run: cd packages/scenario-service && pip install -e ".[dev]" && pytest tests/ -v

  test-portal:
    name: Angular Portal Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & lint
        run: cd packages/portal && npm ci && npm run lint
      - name: Build
        run: cd packages/portal && npm run build --prod

  mock-integration:
    name: Mock Integration Run
    runs-on: ubuntu-latest
    needs: [test-worker, test-services]
    steps:
      - uses: actions/checkout@v4
      - name: Start mock environment
        run: docker compose -f infra/docker/docker-compose.mock.yml up -d
      - name: Wait for services
        run: sleep 15
      - name: Run example scenarios against mock
        run: |
          pip install httpx
          python scripts/run_example_scenarios.py --env mock --suite examples/scenarios/
      - name: Stop
        run: docker compose -f infra/docker/docker-compose.mock.yml down
