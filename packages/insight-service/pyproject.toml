[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insight-service"
version = "0.1.0"
description = "PayProbe insight service — advisory failure categorization, explanation, and outcome prediction over run history (ADR-0005)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "pyjwt>=2.0"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
# The learned layer is OPTIONAL by design (ADR-0005): without it the service
# runs on the deterministic heuristic + frequency baselines, which are the
# permanent fallback anyway.
ml = ["scikit-learn>=1.4", "numpy>=1.26"]

[tool.hatch.build.targets.wheel]
packages = ["insight_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
