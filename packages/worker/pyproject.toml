[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payprobe-worker"
version = "0.1.0"
description = "PayProbe async test execution engine"
requires-python = ">=3.11"
dependencies = [
    "uvloop>=0.19",
    "aiohttp>=3.9",
    "asyncpg>=0.29",
    "python-pkcs11>=0.7",
    "iso8583>=1.0",
    "pydantic>=2.0",
    "redis[hiredis]>=5.0",
    "structlog>=23.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "black", "pytest-cov"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
