worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;

    upstream orchestrator   { server orchestrator:8000; }
    upstream scenario_svc   { server scenario-service:8000; }
    upstream report_svc     { server report-service:8000; }
    upstream auth_svc       { server auth-service:8000; }

    server {
        listen 80;

        # Angular portal
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Backend API routing
        location /api/auth/       { proxy_pass http://auth_svc/; }
        location /api/scenarios/  { proxy_pass http://scenario_svc/; }
        location /api/reports/    { proxy_pass http://report_svc/; }
        location /api/runs/ {
            proxy_pass http://orchestrator/;
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }
    }
}
