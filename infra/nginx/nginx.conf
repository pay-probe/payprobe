worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream orch_svc      { server orchestrator:8100; }
    upstream scenario_svc  { server scenario-service:8000; }
    upstream report_svc    { server report-service:8000; }
    upstream auth_svc      { server auth-service:8000; }
    upstream assistant_svc { server assistant:8400; }
    upstream insight_svc   { server insight-service:8500; }

    server {
        listen 80;

        # Angular portal
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Backend API routing (each prefix is stripped before proxying)
        location /api/auth/      { proxy_pass http://auth_svc/; }
        location /api/scenarios/ { proxy_pass http://scenario_svc/; }
        location /api/reports/   { proxy_pass http://report_svc/; }
        location /api/assistant/ {
            proxy_pass http://assistant_svc/;
            proxy_read_timeout 120s;
        }
        # advisory ML insights (ADR-0005); /train can take a while on a big corpus
        location /api/insights/ {
            proxy_pass http://insight_svc/;
            proxy_read_timeout 120s;
        }

        # run-orchestrator: REST + long-lived WebSocket run streams
        location /api/orch/ {
            proxy_pass http://orch_svc/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
