worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;

    # WebSocket upgrade mapping (for the orchestrator run stream)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream scenario_svc  { server scenario-service:8000; }
    upstream orch_svc      { server orchestrator:8100; }
    upstream auth_svc      { server auth-service:8300; }
    upstream assistant_svc { server assistant:8400; }
    upstream insight_svc   { server insight-service:8500; }

    server {
        listen 80;

        # Angular portal (served from this image's html root)
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # auth-service  ->  /api/auth/* maps to /*  (token issuance, /me)
        location /api/auth/ {
            proxy_pass http://auth_svc/;
        }

        # scenario-service  ->  /api/scenarios/* maps to /*
        location /api/scenarios/ {
            proxy_pass http://scenario_svc/;
        }

        # config assistant  ->  /api/assistant/* maps to /*  (chat + /health)
        location /api/assistant/ {
            proxy_pass http://assistant_svc/;
            proxy_read_timeout 120s;   # LLM tool-calling turns can be slow
        }

        # insight service  ->  /api/insights/* maps to /*  (ADR-0005, advisory)
        location /api/insights/ {
            proxy_pass http://insight_svc/;
            proxy_read_timeout 120s;   # /train over a big corpus can be slow
        }

        # run-orchestrator  ->  /api/orch/* maps to /*  (REST + WebSocket)
        location /api/orch/ {
            proxy_pass http://orch_svc/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;   # long-lived run streams
            proxy_send_timeout 3600s;
        }
    }
}
