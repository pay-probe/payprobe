# Minimal stack (portal + scenario-service + orchestrator + auth-service): no
# assistant / insight upstreams, TLS terminated here with a mounted certificate
# (/etc/nginx/tls/server.crt, server.key). Only :443 is served.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;

    # WebSocket upgrade mapping (for the orchestrator run stream)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream scenario_svc  { server scenario-service:8000; }
    upstream orch_svc      { server orchestrator:8100; }
    upstream auth_svc      { server auth-service:8300; }

    server {
        listen 443 ssl;
        http2 on;
        ssl_certificate     /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Angular portal (served from this image's html root)
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # auth-service  ->  /api/auth/* maps to /*  (token issuance, /me)
        location /api/auth/ {
            proxy_pass http://auth_svc/;
        }

        # scenario-service  ->  /api/scenarios/* maps to /*
        location /api/scenarios/ {
            proxy_pass http://scenario_svc/;
        }

        # assistant / insights / agent-hub are not deployed in the minimal
        # stack: answer 503 so the portal's optional panels (and the Agents
        # page) fail fast instead of receiving index.html for JSON.
        location /api/assistant/ { return 503; }
        location /api/insights/  { return 503; }
        location /api/agents/    { return 503; }

        # run-orchestrator  ->  /api/orch/* maps to /*  (REST + WebSocket)
        location /api/orch/ {
            proxy_pass http://orch_svc/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;   # long-lived run streams
            proxy_send_timeout 3600s;
        }
    }
}
