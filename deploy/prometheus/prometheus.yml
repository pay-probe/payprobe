# Prometheus scrape config for the PayProbe stack.
# Brought up with `docker compose --profile observability up`.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

# Alerting/recording rules (soak leak detection lives here).
rule_files:
  - /etc/prometheus/rules/*.rules.yml

scrape_configs:
  - job_name: orchestrator
    metrics_path: /metrics
    static_configs:
      - targets: ["orchestrator:8100"]
        labels: { service: orchestrator }

  - job_name: scenario-service
    metrics_path: /metrics
    static_configs:
      - targets: ["scenario-service:8000"]
        labels: { service: scenario-service }

  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:8300"]
        labels: { service: auth-service }

  # Load-test workers, when run as a scaled external fleet, can expose /metrics
  # too; add them here (or use DNS/k8s service discovery) once they do.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
