    </defs><rect width="1280" height="560" fill="#0B0D12"/><rect width="1280" height="560" fill="url(#dots)" opacity="0.5"/>
      <circle cx="1100.8" cy="22.400000000000002" r="280.0" fill="url(#glowP)"/>
      <circle cx="51.2" cy="560.0" r="257.6" fill="url(#glowG)"/><text x="80" y="80" font-family="DejaVu Serif, Georgia, serif" font-size="30" font-weight="700" fill="#EEF1F7" text-anchor="start" letter-spacing="0">Three phases, gated end to end</text><text x="80" y="114" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#AEB6C4" text-anchor="start" letter-spacing="0">Each phase must pass before the next runs — so you know exactly where it stopped.</text><rect x="80" y="180" width="350" height="270" rx="18" fill="#14171F" stroke="#272C38" stroke-width="1.5" filter="url(#sh)"/><text x="108" y="224" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#8A7BFF" text-anchor="start" letter-spacing="2">PHASE 1</text><text x="108" y="262" font-family="DejaVu Serif, Georgia, serif" font-size="22" font-weight="700" fill="#EEF1F7" text-anchor="start" letter-spacing="0">Component health</text><text x="108" y="298" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#AEB6C4" text-anchor="start" letter-spacing="0">Probe each system in isolation —</text><text x="108" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#AEB6C4" text-anchor="start" letter-spacing="0">HSM up? Switch answering?</text><rect x="108" y="404" width="294" height="12" rx="6" fill="#1B1F29" stroke="#1B1F29" stroke-width="0"/><rect x="108" y="404" width="294.0" height="12" rx="6" fill="#2DD4A7" stroke="#2DD4A7" stroke-width="0"/><text x="108" y="438" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2DD4A7" text-anchor="start" letter-spacing="0">PASS</text><text x="470.0" y="323.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#2DD4A7" text-anchor="middle" letter-spacing="0">➜</text><rect x="510" y="180" width="350" height="270" rx="18" fill="#14171F" stroke="#272C38" stroke-width="1.5" filter="url(#sh)"/><text x="538" y="224" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#8A7BFF" text-anchor="start" letter-spacing="2">PHASE 2</text><text x="538" y="262" font-family="DejaVu Serif, Georgia, serif" font-size="22" font-weight="700" fill="#EEF1F7" text-anchor="start" letter-spacing="0">Integration pairs</text><text x="538" y="298" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#AEB6C4" text-anchor="start" letter-spacing="0">Terminal↔server, server↔HSM,</text><text x="538" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#AEB6C4" text-anchor="start" letter-spacing="0">server↔core — every link.</text><rect x="538" y="404" width="294" height="12" rx="6" fill="#1B1F29" stroke="#1B1F29" stroke-width="0"/><rect x="538" y="404" width="211.67999999999998" height="12" rx="6" fill="#2DD4A7" stroke="#2DD4A7" stroke-width="0"/><text x="538" y="438" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#E0A82E" text-anchor="start" letter-spacing="0">72%</text><text x="900.0" y="323.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#2DD4A7" text-anchor="middle" letter-spacing="0">➜</text><rect x="940" y="180" width="350" height="270" rx="18" fill="#14171F" stroke="#272C38" stroke-width="1.5" filter="url(#sh)"/><text x="968" y="224" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#8A7BFF" text-anchor="start" letter-spacing="2">PHASE 3</text><text x="968" y="262" font-family="DejaVu Serif, Georgia, serif" font-size="22" font-weight="700" fill="#EEF1F7" text-anchor="start" letter-spacing="0">End-to-end flows</text><text x="968" y="298" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#AEB6C4" text-anchor="start" letter-spacing="0">Full journeys: auth, reversal,</text><text x="968" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#AEB6C4" text-anchor="start" letter-spacing="0">settlement, clearing.</text><rect x="968" y="404" width="294" height="12" rx="6" fill="#1B1F29" stroke="#1B1F29" stroke-width="0"/><rect x="968" y="404" width="294.0" height="12" rx="6" fill="#2DD4A7" stroke="#2DD4A7" stroke-width="0"/><text x="968" y="438" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2DD4A7" text-anchor="start" letter-spacing="0">PASS</text></svg>