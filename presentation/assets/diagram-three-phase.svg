<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560"><defs>
      <linearGradient id="brandg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#5333ED"/><stop offset="1" stop-color="#7B78F0"/>
      </linearGradient>
      <linearGradient id="wordg" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#A89BFF"/><stop offset=".5" stop-color="#5333ED"/><stop offset="1" stop-color="#2DD4A7"/>
      </linearGradient>
      <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#5333ED" stop-opacity="0.55"/><stop offset="1" stop-color="#5333ED" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="glowG" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#2DD4A7" stop-opacity="0.35"/><stop offset="1" stop-color="#2DD4A7" stop-opacity="0"/>
      </radialGradient>
      <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
